name: CI

on:
  push:
    branches: [ "main", "master", "develop", "dev-*" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Fast, dependency-free gate: every PHP/JS file parses and endings are sane.
  # ---------------------------------------------------------------------------
  syntax:
    name: Syntax (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        run: |
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './dist/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Setup Node
        if: matrix.php == '8.3'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        if: matrix.php == '8.3'
        run: |
          for f in assets/js/*.js; do
            node --check "$f"
          done

      - name: Ensure committed files use LF line endings
        if: matrix.php == '8.3'
        run: |
          if git ls-files --eol | grep -E 'i/(crlf|mixed)'; then
            echo "::error::Tracked files with CRLF/mixed line endings found (see .gitattributes)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Test suite. It runs against an in-memory WordPress/wpdb mock (tests/bootstrap.php),
  # so no WordPress install or Composer dependencies are needed.
  # ---------------------------------------------------------------------------
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
        include:
          - php: '8.4'
            allow_failure: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none

      - name: Run Test Suite
        run: php tests/run_all_tests.php
        continue-on-error: ${{ matrix.allow_failure || false }}

  # ---------------------------------------------------------------------------
  # Real MySQL concurrency: many parallel processes hammer the same inventory row and
  # we assert that no seat is ever oversold, lost or duplicated. The mocked suite cannot
  # prove this (it cannot reproduce gap-lock deadlocks or duplicate-key races).
  # ---------------------------------------------------------------------------
  mysql:
    name: Real MySQL inventory concurrency
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tourivo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, mysqli
          coverage: none

      - name: Run inventory concurrency test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: tourivo_test
          DB_USER: root
          DB_PASSWORD: root
          RUNS: '5'
          WORKERS: '12'
        run: |
          set +e
          set -o pipefail
          php tests/RealDb/run_inventory_concurrency.php | tee concurrency-report.txt
          status=$?
          { echo '### Inventory concurrency'; echo '```'; head -c 50000 concurrency-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # ---------------------------------------------------------------------------
  # Code standards & static analysis. Advisory (non-blocking) until the first green
  # baseline on this branch has been confirmed; then drop `continue-on-error`.
  # ---------------------------------------------------------------------------
  lint:
    name: Code Standards (PHPCS)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2, cs2pr

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPCS
        run: |
          set +e
          vendor/bin/phpcs -q --report=full > phpcs-report.txt
          status=$?
          vendor/bin/phpcs -q --report=checkstyle | cs2pr --graceful-warnings
          # Compact, annotation-sized digest of the errors (annotations are capped at ~10 per step).
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$1"; }
          vendor/bin/phpcs -q --warning-severity=0 --report=source > phpcs-source.txt
          vendor/bin/phpcs -q --warning-severity=0 --report=emacs | head -60 > phpcs-errors.txt
          echo "::error title=PHPCS error sources::$(enc phpcs-source.txt)"
          echo "::error title=PHPCS first errors::$(enc phpcs-errors.txt)"
          { echo '### PHPCS'; echo '```'; head -c 50000 phpcs-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  analyse:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: |
          set +e
          vendor/bin/phpstan analyse --no-progress --error-format=table > phpstan-report.txt
          status=$?
          vendor/bin/phpstan analyse --no-progress --error-format=github
          { echo '### PHPStan'; echo '```'; head -c 50000 phpstan-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # ---------------------------------------------------------------------------
  # Release package: build the distributable zip and keep it as a downloadable artifact.
  # ---------------------------------------------------------------------------
  package:
    name: Build Release Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, zip
          coverage: none

      - name: Build & verify package
        run: php bin/build-package.php

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourivo-package
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Single required check for branch protection.
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI passed
    if: always()
    needs: [syntax, test, mysql, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        run: |
          echo "syntax:  ${{ needs.syntax.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "mysql:   ${{ needs.mysql.result }}"
          echo "package: ${{ needs.package.result }}"
          if [ "${{ needs.syntax.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.mysql.result }}" != "success" ] || [ "${{ needs.package.result }}" != "success" ]; then
            echo "::error::A required job failed."
            exit 1
          fi
